name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"  # weekly: catch docxtpl upstream changes
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
  docxtpl-upstream:
    # Ground truth against the newest docxtpl release and upstream master.
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        docxtpl: ["docxtpl", "git+https://github.com/elapouya/python-docx-template.git"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - env:
          DOCXTPL_SPEC: ${{ matrix.docxtpl }}
        run: pip install -e ".[dev]" && pip install --upgrade "$DOCXTPL_SPEC"
      - run: pytest -q tests/test_docxtpl_behaviour.py tests/test_v13.py tests/test_v14.py
  benchmark:
    # 0 false positives on python-docx-template's own test templates (benchmark/expected.json).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e .[render]
      - run: git clone --depth 1 https://github.com/elapouya/python-docx-template /tmp/docxtpl
      - run: python scripts/benchmark.py /tmp/docxtpl/tests/templates --json benchmark-result.json
      - run: cat benchmark-result.json >> "$GITHUB_STEP_SUMMARY"
        if: always()
  playground:
    # The wheel must keep working inside Pyodide (browser playground).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: pip install build && python -m build --wheel && pip install dist/*.whl && bash scripts/build_site.sh
      - run: npm install --no-save pyodide@314.0.7 && node scripts/pyodide_smoke.mjs _site
  action:
    # Dogfood the composite action on the bundled examples (path with a space included).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir -p "tmp dir" && cp examples/clean.docx "tmp dir/clean copy.docx"
      - uses: ./
        with:
          files: |
            examples/clean.docx
            tmp dir/*.docx
      # failing templates: summary, SARIF and annotated copies; the step must fail
      - id: bad
        continue-on-error: true
        uses: ./
        with:
          files: examples/issue*.docx
          sarif: docxtpl-lint.sarif
          annotate: "true"
      - env:
          BAD_OUTCOME: ${{ steps.bad.outcome }}
        run: |
          test "$BAD_OUTCOME" = "failure"
          python -c "import json; r=json.load(open('docxtpl-lint.sarif'))['runs'][0]['results']; assert r and all('partialFingerprints' in x for x in r)"
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build twine && python -m build && twine check dist/*
