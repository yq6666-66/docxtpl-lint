name: Publish to PyPI
# PyPI Trusted Publishing (OIDC, no token stored in GitHub).
# Prepared but deliberately manual: it only runs when started from the Actions
# tab ("Run workflow") with the tag to publish. One-time setup on pypi.org:
#   Publishing → Add a pending publisher → owner yq6666-66, repo docxtpl-lint,
#   workflow publish-pypi.yml, environment pypi.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v0.2.0
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tag must look like a version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-]?[A-Za-z0-9.]+)?$ ]] || { echo "::error::tag input is not a version tag (vX.Y.Z)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tag commit must be on main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          tag_sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          test "$(git rev-parse HEAD)" = "$tag_sha"
          git merge-base --is-ancestor "$tag_sha" refs/remotes/origin/main || { echo "::error::$TAG ($tag_sha) is not on main"; exit 1; }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build twine && python -m build && twine check dist/*
      - name: Version must match tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/docxtpl-lint/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
