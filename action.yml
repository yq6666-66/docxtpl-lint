name: docxtpl-lint
description: Lint docxtpl (python-docx-template) Word templates; annotate errors with the exact table cell in runs and PRs
author: yq6666-66
branding:
  icon: file-text
  color: blue
inputs:
  files:
    description: Newline-separated .docx paths or globs (`**` supported). Paths may contain spaces.
    required: true
  args:
    description: Extra CLI arguments, e.g. "--data sample.json --fail-on warning" (split on spaces; no quoting)
    required: false
    default: ""
  python-version:
    description: Python version used to run the linter
    required: false
    default: "3.12"
  summary:
    description: Write a Markdown table of the findings to the job summary
    required: false
    default: "true"
  baseline:
    description: Baseline file (from `docxtpl-lint --write-baseline`); only new findings fail
    required: false
    default: ""
  sarif:
    description: Also write a SARIF report to this path (upload it with github/codeql-action/upload-sarif)
    required: false
    default: ""
  annotate:
    description: Upload copies of failing templates with Word comments as the artifact `docxtpl-lint-annotated`
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$ACTION_PATH"
    - id: lint
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        ARGS: ${{ inputs.args }}
        SUMMARY: ${{ inputs.summary }}
        BASELINE: ${{ inputs.baseline }}
        SARIF: ${{ inputs.sarif }}
        ANNOTATE: ${{ inputs.annotate }}
      run: |
        shopt -s globstar nullglob
        files=()
        while IFS= read -r pattern; do
          [ -z "$pattern" ] && continue
          IFS=$'\n'
          # unquoted on purpose: expand the glob, split only on newlines
          matches=( $pattern )
          unset IFS
          files+=( "${matches[@]}" )
        done <<< "$FILES"
        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::docxtpl-lint: no files matched"
          exit 2
        fi
        read -r -a extra <<< "$ARGS"
        truthy() { [[ "${1,,}" =~ ^(true|1|yes|on)$ ]]; }
        opts=()
        md="$RUNNER_TEMP/docxtpl-lint-summary.md"
        truthy "$SUMMARY" && opts+=( --report "markdown:$md" )
        [ -n "$BASELINE" ] && opts+=( --baseline "$BASELINE" )
        [ -n "$SARIF" ] && opts+=( --report "sarif:$SARIF" )
        truthy "$ANNOTATE" && opts+=( --annotate "$RUNNER_TEMP/docxtpl-lint-annotated" )
        rc=0
        docxtpl-lint --format github "${opts[@]}" "${extra[@]}" "${files[@]}" || rc=$?
        if truthy "$SUMMARY" && [ -f "$md" ]; then cat "$md" >> "$GITHUB_STEP_SUMMARY"; fi
        if compgen -G "$RUNNER_TEMP/docxtpl-lint-annotated/*.docx" > /dev/null; then
          echo "annotated=true" >> "$GITHUB_OUTPUT"
        fi
        exit $rc
    - if: ${{ always() && steps.lint.outputs.annotated == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: docxtpl-lint-annotated
        path: ${{ runner.temp }}/docxtpl-lint-annotated
